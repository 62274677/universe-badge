name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff pytest mpy-cross
      - run: ruff check .
      # CPython accepts syntax MicroPython doesn't; compile with the real thing.
      # armv7emsp is the RP2350's native target, so Viper code is checked too.
      - name: Compile badge code with MicroPython's compiler
        run: |
          for f in $(find badge -name '*.py'); do
            python -m mpy_cross -march=armv7emsp -o "$RUNNER_TEMP/check.mpy" "$f"
          done
      - run: pytest
      - name: Build the OTA site
        run: python tools/build_manifest.py --out dist --version "${{ github.run_number }}-${GITHUB_SHA::7}"
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Runs the app in the badger.github.io simulator: fails on a traceback, and
  # uploads a screenshot of what badges will show.
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/preview/package-lock.json
      - run: npm ci --prefix tools/preview
      - uses: actions/cache@v6
        with:
          path: ~/.cache/universe-badge-sim
          key: badge-sim-${{ hashFiles('tools/preview/preview.mjs') }}
      - name: Run each app in the simulator
        run: |
          node tools/preview/preview.mjs --ms 3000 --out preview.png
          node tools/preview/preview.mjs --app screensaver --ms 6000 --out preview-screensaver.png
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: preview*.png
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [check, simulate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}manifest.json
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
