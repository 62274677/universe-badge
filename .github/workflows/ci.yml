name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff pytest mpy-cross
      - run: ruff check .
      # CPython accepts syntax MicroPython doesn't; compile with the real thing.
      - name: Compile badge code with MicroPython's compiler
        run: |
          for f in $(find badge -name '*.py'); do
            python -m mpy_cross -o "$RUNNER_TEMP/check.mpy" "$f"
          done
      - run: pytest
      - name: Build the OTA site
        run: python tools/build_manifest.py --out dist --version "${{ github.run_number }}-${GITHUB_SHA::7}"
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}manifest.json
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
